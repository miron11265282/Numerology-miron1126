name: Build App (Android + iOS)

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"

          if [ ! -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdline-tools.zip
            rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
            mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          fi

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "cmdline-tools;latest" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Generate Gradle wrapper if missing
        working-directory: android
        shell: bash
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.7
            chmod +x ./gradlew
          fi

      - name: Build APK
        working-directory: android
        shell: bash
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    name: iPhone IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        shell: bash
        run: |
          set -euxo pipefail
          ls -la
          xcodegen generate
          ls -la

      - name: Build iOS app
        working-directory: ios
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -f "Numerology.xcodeproj/project.pbxproj" ]; then
            echo "Xcode project was not generated"
            find . -maxdepth 3 -type f | sed 's#^#/#'
            exit 1
          fi

          xcodebuild \
            -project Numerology.xcodeproj \
            -scheme Numerology \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Pack IPA
        working-directory: ios
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Numerology.app Payload/
          zip -qr Numerology-unsigned.ipa Payload

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ios/Numerology-unsigned.ipa
